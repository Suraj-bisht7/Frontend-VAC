<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- Top Card: Logo and Login Form -->
        <div class="login-card">
            <!-- Instagram Logo placeholder -->
            <h1 class="instagram-logo">Instagram</h1>
            
            <form action="#">
                <input type="text" placeholder="Phone number, username, or email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn-login">Log in</button>
            </form>

            <!-- OR Divider -->
            <div class="or-separator">
                <div class="line"></div>
                <div class="or-text">OR</div>
                <div class="line"></div>
            </div>

            <!-- Facebook Login Option -->
            <button class="btn-fb-login">
                <span class="fb-icon">📘</span> Log in with Facebook
            </button>

            <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <!-- Bottom Card: Signup Redirect -->
        <div class="signup-card">
            <p>Don't have an account? <a href="#" class="signup-link">Sign up</a></p>
        </div>
    </div>
</body>
</html>
