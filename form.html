<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

    <h2>Student Registration Form</h2>
    
    <form action="YOUR_GOOGLE_FORM_URL" method="POST">
        
        Full Name:<br>
        <input type="text" name="NAME_ID" required><br><br>

        Email Address:<br>
        <input type="email" name="EMAIL_ID" required><br><br>

        Password:<br>
        <input type="password" name="PASSWORD_ID" required><br><br>

        Date of Birth:<br>
        <input type="date" name="DOB_ID" required><br><br>

        Gender:<br>
        <input type="radio" name="GENDER_ID" value="Male" required> Male
        <input type="radio" name="GENDER_ID" value="Female"> Female
        <input type="radio" name="GENDER_ID" value="Other"> Other<br><br>

        Hobbies:<br>
        <input type="checkbox" name="HOBBY_ID" value="Sports"> Sports<br>
        <input type="checkbox" name="HOBBY_ID" value="Music"> Music<br>
        <input type="checkbox" name="HOBBY_ID" value="Reading"> Reading<br>
        <input type="checkbox" name="HOBBY_ID" value="Coding"> Coding<br><br>

        <input type="submit" value="Register Student">
        
    </form>

</body>
</html>
